<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动漫 · 青茉日记</title>
  <script>
    (function () {
      try {
        const queryTheme = new URLSearchParams(location.search).get("theme");
        const theme = queryTheme === "light" || queryTheme === "dark"
          ? queryTheme
          : (localStorage.getItem("qingji:theme") || "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        localStorage.setItem("qingji:theme", theme);
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body data-page="anime">
  <header class="anime-topbar">
    <div>
      <p class="page-kicker">ANIME ARCHIVE</p>
      <h1>动漫</h1>
    </div>
    <span class="anime-brand-mark">番</span>
  </header>

  <main class="anime-main">
    <section class="anime-stats" id="anime-stats"></section>

    <div class="anime-controls">
      <div class="anime-actions">
        <button class="button" type="button" id="anime-add">＋ 添加动漫</button>
        <button class="button secondary" type="button" id="anime-export">导出备份</button>
        <label class="button secondary" for="anime-import">导入备份</label>
        <input id="anime-import" type="file" accept="application/json,.json" hidden>
      </div>
      <label class="anime-search">
        <span>⌕</span>
        <input id="anime-search" type="search" placeholder="搜索片名或标签" autocomplete="off">
      </label>
      <div class="anime-filters" id="anime-filters">
        <button class="anime-filter active" type="button" data-status="全部">全部</button>
        <button class="anime-filter" type="button" data-status="在看">在看</button>
        <button class="anime-filter" type="button" data-status="想看">想看</button>
        <button class="anime-filter" type="button" data-status="看过">看过</button>
      </div>
    </div>

    <div class="anime-count" id="anime-count"></div>
    <section class="anime-list" id="anime-list"></section>
    <button class="anime-load-more" id="anime-load-more" type="button" hidden>显示更多</button>
  </main>

  <div class="anime-modal" id="anime-modal" hidden>
    <button class="anime-modal-backdrop" type="button" data-close-anime aria-label="关闭简评窗口"></button>
    <form class="anime-modal-card" id="anime-comment-form">
      <div class="anime-modal-head">
        <div>
          <p class="page-kicker">MEMORY NOTE</p>
          <h2 id="anime-modal-title">一句话简评</h2>
        </div>
        <button class="anime-modal-close" type="button" data-close-anime aria-label="关闭">×</button>
      </div>
      <div class="anime-edit-grid">
        <label>总集数
          <input id="anime-edit-episodes" type="number" min="0" max="9999" inputmode="numeric" placeholder="未知可留空">
        </label>
        <label>状态
          <select id="anime-edit-status">
            <option value="在看">在看</option>
            <option value="想看">想看</option>
            <option value="看过">看过</option>
          </select>
        </label>
      </div>
      <fieldset class="anime-date-fields">
        <legend>观看时间</legend>
        <label>年
          <input id="anime-watch-year" type="number" min="2016" max="2100" inputmode="numeric" placeholder="年">
        </label>
        <label>月
          <input id="anime-watch-month" type="number" min="1" max="12" inputmode="numeric" placeholder="月">
        </label>
        <label>日
          <input id="anime-watch-day" type="number" min="1" max="31" inputmode="numeric" placeholder="日">
        </label>
      </fieldset>
      <label>留给自己的记忆
        <input id="anime-comment-input" type="text" maxlength="120" autocomplete="off" placeholder="一句话就好">
      </label>
      <div class="anime-modal-actions">
        <button class="button ghost-danger" id="anime-delete-custom" type="button" hidden>删除这部动漫</button>
        <button class="button secondary" type="button" data-close-anime>取消</button>
        <button class="button" type="submit">保存</button>
      </div>
    </form>
  </div>

  <div class="anime-modal" id="anime-add-modal" hidden>
    <button class="anime-modal-backdrop" type="button" data-close-anime-add aria-label="关闭添加动漫窗口"></button>
    <form class="anime-modal-card" id="anime-add-form">
      <div class="anime-modal-head">
        <div>
          <p class="page-kicker">NEW ANIME</p>
          <h2>添加动漫</h2>
        </div>
        <button class="anime-modal-close" type="button" data-close-anime-add aria-label="关闭">×</button>
      </div>
      <div class="anime-add-grid">
        <label class="form-full">片名
          <input id="anime-add-title" type="text" maxlength="80" required autocomplete="off">
        </label>
        <label>原名
          <input id="anime-add-original" type="text" maxlength="120" autocomplete="off">
        </label>
        <label>年份
          <input id="anime-add-year" type="number" min="1900" max="2100" inputmode="numeric">
        </label>
        <label>状态
          <select id="anime-add-status">
            <option value="在看">在看</option>
            <option value="想看">想看</option>
            <option value="看过">看过</option>
          </select>
        </label>
        <label>总集数
          <input id="anime-add-episodes" type="number" min="0" max="9999" inputmode="numeric" placeholder="未知可留空">
        </label>
        <label class="form-full">小海报（可选）
          <input id="anime-add-poster" type="file" accept="image/*">
        </label>
      </div>
      <div class="anime-modal-actions">
        <button class="button secondary" type="button" data-close-anime-add>取消</button>
        <button class="button" type="submit">添加到动漫</button>
      </div>
    </form>
  </div>

  <script src="./assets/anime-data.js"></script>
  <script src="./assets/anime-ui.js"></script>
</body>
</html>
